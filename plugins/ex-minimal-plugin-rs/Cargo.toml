# 本 crate 是 ex-minimal-project-rs 的擴展而非獨立專案：不自成 workspace，由
# 專案以路徑依賴掛上，隨專案自己的 promptex 執行檔一起編譯（Rust 的求值在編譯期
# 綁定，擴展因此是同一次編譯的一部分，不是執行期載入的模組）。同時保持可發布
# 形態，中繼欄位比照 promptex 的 alpha 原型套件。
[package]
name = "ex-minimal-plugin-rs"
version = "0.0.1-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/promptex-ai/ex-minimal-project-rs"
description = "promptex plugin 擴展範例（alpha）：在改寫遍為 skill 與 rule 追加一行"
readme = "README.md"
keywords = ["promptex", "prompt", "ai", "llm", "agent"]
categories = ["development-tools", "development-tools::build-utils"]

[dependencies]
promptex-rs = "0.0.0"
