# 發布入口：把一次發版的套件單元發布到 crates.io，alpha、beta、rc 與 GA 每個階段都發布。
#
# 發布的 crate 只有 plugins/ex-minimal-plugin-rs 與 adapters/ex-minimal-adapter-rs，兩者以
# linked-versions 同版。crates.io 沒有 dist-tag：版號照 SemVer 原樣發布，cargo 在版本需求沒有
# 寫出預發布版時不會選它。判斷集中在 scripts/release/publish-units.sh：它依單元帶的檔案決定
# 註冊中心，只收 manifest 列出的兩個路徑，逐單元核對版號屬於這個階段，已在 crates.io 的版號跳過。
#
# 由 release-please.yml 在單元 tag 建立後以 workflow_dispatch 派送，ref 是這次發版的單元 tag。
# 入口必須是本檔，不能由其他 workflow 以 workflow_call 呼叫：crates.io 的 Trusted Publisher 比對
# 被觸發的 workflow 檔名，被呼叫時比對到的是呼叫端。
#
# crates.io 走 Trusted Publishing（OIDC），不使用長期 token：rust-lang/crates-io-auth-action 以
# job 的 OIDC 憑證換取短期 token，job 結束時自動撤銷，倉庫端不持有任何可外洩的長期密鑰，因此本檔
# 沒有任何 secrets 引用，只有 id-token 權限。登記值為 owner promptex-ai、repo ex-minimal-project-rs、
# workflow publish.yml，environment 留空：本檔不宣告 environment。crates.io 沒有對應 npm provenance
# 或 PyPI attestations 的來源證明可開。
name: Publish

on:
  workflow_dispatch:
    inputs:
      paths:
        description: '發版的套件路徑，JSON 陣列，例如 ["plugins/ex-minimal-plugin-rs"]'
        required: true
        type: string
      stage:
        description: 發布分支所在的階段；每個單元的版號都必須屬於這個階段
        required: true
        type: choice
        options: [alpha, beta, rc, ga]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# 同一個階段與同一組單元的重複派送排隊等候，不取消；publish-units.sh 會跳過已發布的版號。
concurrency:
  group: publish-${{ inputs.stage }}-${{ inputs.paths }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC 憑證簽發所需。
      id-token: write
      contents: read
    steps:
      # 本 job 持有 id-token: write，第三方與官方 action 一律釘 SHA。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支，2026-09-11 釘
        with:
          toolchain: stable

      # crates.io 的 OIDC 交換：取回的短期 token 在 job 結束時自動撤銷。
      - name: crates.io 取得短期憑證
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: 發布到 crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"
